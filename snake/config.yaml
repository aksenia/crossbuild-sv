# crossbuild-sv run configuration. Paths are as seen by the container.

# -----------------
# Run details
# -----------------
sample: HG002

input_vcf: /data/GIAB_WGStest_100022508836_GRCh37.sv.vcf.gz
results_dir: /results

# Optional hg19 contig subset (source naming). Empty = whole genome.
# Dev/test set: 14 (cross-chromosome lifts, rejections in every tool),
# 21 (real POS disagreements between tools), Y (most symbolic DUPs).
contigs: []

# -----------------
# SV type filter (INFO/SVTYPE). BND is out of scope.
# DRAGEN tandem duplications are SVTYPE=DUP with ALT <DUP:TANDEM>.
# -----------------
sv_types:
  - DEL
  - DUP
  - INS
  - INV

# Keep only FILTER=PASS (or missing) records
pass_only: true

# -----------------
# Liftover tools to run
# -----------------
liftover_tools:
  - crossmap
  - bcftools
  - picard
  - transanno

picard_java_opts: "-Xmx6g"

# -----------------
# References
# -----------------
ref:
  hg19_fasta: /ref/hg19.fa                 # numeric contigs (1, 2, ...), Picard source + Transanno
  hg19_fasta_chr: /ref/hg19.chr.fa         # same assembly, chr-prefixed, for bcftools +liftover
  hg38_fasta: /ref/hg38.fa                 # chr-prefixed, with .fai and .dict
  liftover_chain: /ref/hg19ToHg38.over.chain          # UCSC: CrossMap, bcftools, Picard
  transanno_chain: /ref/transanno.hg19tohg38.chain    # Transanno only

# -----------------
# Region BED files (inside container at /app/regions/)
# -----------------
regions:
  cups_hg19:     /app/regions/cups/FASTA_BED.ALL_GRCh37.novel_CUPs.bed.gz
  cups_hg38:     /app/regions/cups/FASTA_BED.ALL_GRCh38.novel_CUPs.bed.gz
  discreps_hg19: /app/regions/discreps/DISCREPS_hg19.sorted.bed.gz
  discreps_hg38: /app/regions/discreps/DISCREPS_hg38.sorted.bed.gz
  centel_hg19:   /app/regions/centel/centel_hg19.bed.gz
  segdups_hg19:  /app/regions/segdups/segdups_hg19.bed.gz
  header:        /app/regions/header.txt

# -----------------
# Container image (used with --use-singularity)
# Build: docker build -t crossbuild-sv:latest .
# HPC:   apptainer build crossbuild-sv.sif docker-daemon://crossbuild-sv:latest
# -----------------
container_image: "docker://crossbuild-sv:latest"

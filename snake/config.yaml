# sv-preprocess/snake/config.yaml

# -----------------
# Run details
# -----------------
sample: HG002_dragen_chr22

# hg19 input consumed by the preprocessing workflow.
input_vcf: /vcf/HG002_dragen.sv.hg19.renamed.chr22.svdb.vcf.gz

# Native hg38 call set reserved for the downstream comparison stage.
# The current preprocessing workflow does not consume this file yet.
native_hg38_vcf: /vcf/HG002_dragen.sv.hg38.renamed.chr22.svdb.vcf.gz
results_dir: /results

# -----------------
# SV type filter
# -----------------
sv_types:
  - DEL
  - INS

pass_only: true

# -----------------
# Liftover tools
# -----------------
liftover_tools:
  - crossmap
  - bcftools
  - picard
  - transanno

# -----------------
# References
# -----------------
ref:
  # hg19 with numeric contigs: 1, 2, ..., X, Y
  hg19_fasta: /ref/hg19/hg19_nochr_fixed.fa

  # hg19 with UCSC contigs: chr1, chr2, ..., chrX, chrY
  hg19_fasta_chr: /ref/hg19/hg19.fa

  # hg38 with chr-prefixed contigs
  hg38_fasta: /ref/hg38/hg38.fa

  # Chains are currently inside regions/chain/
  liftover_chain: /app/regions/chain/hg19ToHg38.over.chain
  transanno_chain: /app/regions/chain/transanno.hg19tohg38.chain

# -----------------
# Region BED files
# -----------------
regions:
  cups_hg19: /app/regions/cups/FASTA_BED.ALL_GRCh37.novel_CUPs.bed.gz
  cups_hg38: /app/regions/cups/FASTA_BED.ALL_GRCh38.novel_CUPs.bed.gz

  discreps_hg19: /app/regions/discreps/DISCREPS_hg19.sorted.bed.gz
  discreps_hg38: /app/regions/discreps/DISCREPS_hg38.sorted.bed.gz

  centel_hg19: /app/regions/centel/centel_hg19.bed.gz
  segdups_hg19: /app/regions/segdups/segdups_hg19.bed.gz

  header: /app/regions/header.txt

# -----------------
# Tool locations
# -----------------
tools:
  merge_script: /app/liftover/merge_tools.py
  normalize_sv_script: /app/liftover/normalize_sv_coordinates.py

# -----------------
# Container image
# -----------------
container_image: "docker://crossbuild-sv:latest"
